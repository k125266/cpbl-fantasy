spring:
  application:
    name: cpbl-fantasy
  datasource:
    url: ${CPBLF_DB_URL:jdbc:postgresql://localhost:5432/cpblf}
    username: ${CPBLF_DB_USER:cpblf}
    password: ${CPBLF_DB_PASSWORD:cpblf}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Taipei

server:
  port: ${PORT:8080}

cpblf:
  zone: Asia/Taipei
  season-year: ${CPBLF_SEASON_YEAR:2026}
  kind-code: A
  # 季後賽（E 一軍季後挑戰賽、C 台灣大賽）：只做即時比分，不結算、不計入 fantasy
  postseason-kind-codes: ${CPBLF_POSTSEASON_KINDS:E,C}
  # 季後賽專區的賽制（以賽事代碼為 key）。advantage-team 是保送 1 勝的球隊，每年依規定更新：
  # 2026 季後挑戰賽由下半季冠軍兄弟（全年勝率較低的半季冠軍）先拿 1 勝
  postseason-series:
    E: { name: 季後挑戰賽, wins-needed: 3, advantage-team: BRO }
    C: { name: 台灣大賽, wins-needed: 4 }
  # 資料來源：demo（模擬賽季，本機開發/展示用）、stats（中職進階數據網站）、
  # replay（以封存的真實球季重播，時鐘可調整）或 web（cpbl.com.tw，CDN 擋爬蟲 UA，目前不可用）
  source: ${CPBLF_SOURCE:demo}
  scheduler-enabled: ${CPBLF_SCHEDULER_ENABLED:true}
  crawler:
    # 規則書 10.3 / CPBLF-71：必須可識別；未設定時啟動失敗
    user-agent: "${CPBLF_USER_AGENT:CPBLFantasyBot/0.1 (private non-commercial league)}"
    base-url: https://www.cpbl.com.tw
    # robots.txt 允許公開頁面、禁止 /api/；只讀公開頁面（docs/m0-data-feasibility.md）
    stats-base-url: https://stats.cpbl.com.tw
    # Live Poller 間隔，下限 60 秒，低於此值啟動失敗
    live-poll-interval-seconds: ${CPBLF_LIVE_POLL_SECONDS:60}
    # 一般請求之間的最小間隔
    min-request-interval-ms: 1500
    max-retries: 3
    initial-backoff-ms: 2000
    # 進行中的賽況細節（目前打者與投手、打席結果代碼）。收到權利人要求時設為 false 立即停用（docs/rulebook-amendments.md）
    live-detail-enabled: ${CPBLF_LIVE_DETAIL_ENABLED:true}
  demo:
    start-at: 2026-03-20T10:00:00+08:00
    seed: 20260328
    seed-league: true
  replay:
    # 重播時鐘起點（開幕前），之後由系統管理員快轉
    start-at: ${CPBLF_REPLAY_START_AT:2026-03-20T10:00:00+08:00}
